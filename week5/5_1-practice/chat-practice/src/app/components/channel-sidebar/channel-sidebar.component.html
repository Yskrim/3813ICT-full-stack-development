<div class="sidebar">
  <h3 class="sidebar-header">Channels: {{ cs.channelCount() }}</h3>
  <ul class="channel-list">
    @for (chan of cs.channels(); track chan.id) {
      <li [class.selected]="cs.currentChannel()?.id === chan.id">
        <a routerLink="/channels" (click)="cs.select(chan.id)"># {{ chan.name }}</a>
        <button type="button" class="remove" (click)="cs.remove(chan.id)" aria-label="Remove channel">×</button>
      </li>
    }
  </ul>

  <form class="create-form" (submit)="handleSubmit($event)">
    <label class="field">
      <span>Create new channel</span>
      <input [(ngModel)]="chName" name="chanName" placeholder="channel name" />
    </label>
    <button type="submit" class="primary">Create</button>
  </form>
</div>
