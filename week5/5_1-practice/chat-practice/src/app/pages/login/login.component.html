<label>
    <h3>Log in form</h3>
    <form (ngSubmit)="login()" (input)="handleWrongCreds()">
        <label>
            <span>Username</span>
            <input name="username" [(ngModel)]="username"/>
        </label>
        <label>
            <span>Password</span>
            <input name="password" [(ngModel)]="password"/>
        </label>
        <button type="submit">Log in</button>
    </form>
    @if(error){
        <p>{{ error }}</p>
    }
</label>
